<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <script
      type="text/javascript"
      src="https://demo.microstrategy.com/MicroStrategyLibrary/javascript/native-embedding-sdk.js"
    ></script>
    <style>
      .card-playground {
        max-width: 322px;
        max-height: 500px;
        margin: 20px;
        display: inline-block;
        border: 1px solid #0e6ff9;
        border-radius: 10px;
        box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.2);
      }
      .card-invisible {
        display: none;
        visibility: hidden;
      }
      .text {
        font-size: 12px;
        font-weight: bold;
        display: block;
        padding-left: 10px;
        padding-top: 5px;
      }
      .viz-container {
        width: 300px;
        height: 300px;
        margin: 10px;
      }
      .selecter {
        width: 200px;
        height: 30px;
        margin: 20px 20px 0 5px;
      }
      .page-select-container {
        margin: 20px 10px 20px 20px;
        text {
          font-size: 20px;
        }
      }
      .render-next-page-btn {
        margin-left: 20px;
        padding: 8px 16px;
        cursor: pointer;
        background: #28a745;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        display: none;
      }
      .render-next-page-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .page-render-status {
        margin-left: 12px;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body onload="renderVizInDashboard()">
    <div class="page-select-container">
      <text> Select Page </text>
      <select id="page-select" class="selecter">
        <option>All</option>
      </select>
      <button id="render-next-page-btn" class="render-next-page-btn">Render Next Page</button>
      <span id="page-render-status" class="page-render-status"></span>
    </div>
    <div id="container" style="width: 100%"></div>
    <script type="text/javascript">
      const renderVizInDashboard = async () => {
        var vizRenderList = [];
        // configuration for the target dashboard
        const dashboardConfigs = {
          projectId: 'EC70648611E7A2F962E90080EFD58751',
          objectId: '85D9C39DC546D9E07FB19FBF36F13A14',
        };
        let serverUrl = 'https://demo.microstrategy.com/MicroStrategyLibrary';
        const config = {
          serverUrl,
          getAuthToken: async () => {
            return fetch(`${serverUrl}/api/auth/login`, {
              method: 'POST',
              credentials: 'include', // including cookie
              mode: 'cors', // setting as CORS mode for cross origin
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                // here we login as guest user, you can log in as normal user with `username` and `password` as well
                // username: "input your username",
                // password: "input your password",
                loginMode: 8, // 8 means guest login, use `1` if you log in as normal user
              }),
            })
              .then((response) => {
                if (response && response.ok) {
                  return response.headers.get('X-MSTR-authToken');
                }
                throw Error('Failed to fetch auth token.');
              })
              .catch((error) => {
                console.log('Error:', error);
              });
          },
        };
        // INSERT PROPERTIES BELOW HERE

        // INSERT PROPERTIES ABOVE HERE
        const environment = await microstrategy.embeddingComponent.environments.create(config);
        const dossier = await environment.loadDossier(dashboardConfigs);
        // print dashboard definition
        const dossierDefinition = await dossier.getDossierDefinition();
        console.log('Dashboard Definition:');
        console.log(dossierDefinition);
        const pageSelecter = document.getElementById('page-select');
        const renderNextPageBtn = document.getElementById('render-next-page-btn');
        const pageRenderStatus = document.getElementById('page-render-status');
        // add all the pages in dashboard into the page selecter
        configurePageSelecter();

        // Build a flat list of all pages
        const allPages = [];
        for (const chapter of dossierDefinition.chapters) {
          for (const page of chapter.pages) {
            allPages.push(page);
          }
        }

        // Track which page index to render next (for incremental mode)
        let nextPageIndex = 0;
        let isIncrementalMode = false;

        // draw the vizs in all pages
        const drawAllViz = async () => {
          vizRenderList = [];
          // clean out the container
          const parent = document.getElementById('container');
          parent.innerHTML = '';
          for (const chapter of dossierDefinition.chapters) {
            for (const page of chapter.pages) {
              for (const viz of page.visualizations) {
                // filter out the the vis which has 'secondaryDataProvidedFor'
                // these viz are not able to render
                if (viz.secondaryDataProvidedFor) {
                  continue;
                }
                var mainContainer = document.getElementById('container');
                var card = document.createElement('div');
                var vizContainer = document.createElement('div');
                populateViz(mainContainer, card, vizContainer, viz);
                // prepare the vizRenderList: {key: vizKey, container: vizContainer}
                vizRenderList.push({
                  key: viz.key,
                  container: vizContainer,
                });
              }
            }
          }
          // draw the viz
          await dossier.refresh(vizRenderList);
        };

        // Render a single page's vizs and return the widget config list
        function buildPageVizCards(page, container) {
          const wcs = [];
          for (const viz of page.visualizations) {
            if (viz.secondaryDataProvidedFor) continue;
            var card = document.createElement('div');
            var vizContainer = document.createElement('div');
            populateViz(container, card, vizContainer, viz);
            wcs.push({ key: viz.key, container: vizContainer });
          }
          return wcs;
        }

        pageSelecter.onchange = handlePageChange;
        await drawAllViz();
        // INSERT METHODS BELOW HERE

        // INSERT METHODS ABOVE HERE

        function populateViz(mainContainer, card, vizContainer, viz) {
          card.classList.add('card-playground');
          card.id = viz.key;

          // populate the vizInfo: vizType, vizName, vizKey
          var vizType = document.createElement('div');
          vizType.classList.add('text');
          vizType.textContent = '- Type: ' + viz.visualizationType;
          card.appendChild(vizType);
          var vizName = document.createElement('div');
          vizName.classList.add('text');
          vizName.textContent = '- Name: ' + viz.name;
          card.appendChild(vizName);
          var vizKey = document.createElement('div');
          vizKey.classList.add('text');
          vizKey.textContent = '- Key: ' + viz.key;
          card.appendChild(vizKey);

          // populate the vizContainer which is the container for the viz rendering
          vizContainer.classList.add('viz-container');
          card.appendChild(vizContainer);
          mainContainer.appendChild(card);
        }

        async function handlePageChange() {
          const selectedText = pageSelecter.options[pageSelecter.selectedIndex].text;

          if (selectedText === 'All') {
            // Reset to all-at-once mode
            isIncrementalMode = false;
            renderNextPageBtn.style.display = 'none';
            pageRenderStatus.textContent = '';
            await drawAllViz();
          } else {
            // Render only the selected page, enter incremental mode
            isIncrementalMode = true;
            const parent = document.getElementById('container');
            parent.innerHTML = '';

            const selectedPageIdx = allPages.findIndex((p) => p.name === selectedText);
            const selectedPage = allPages[selectedPageIdx];
            const wcs = buildPageVizCards(selectedPage, parent);

            pageRenderStatus.textContent = `Rendering page: ${selectedPage.name}...`;
            await dossier.refresh(wcs);

            // Set nextPageIndex to the page after the selected one
            nextPageIndex = selectedPageIdx + 1;

            if (nextPageIndex < allPages.length) {
              renderNextPageBtn.style.display = 'inline-block';
              renderNextPageBtn.disabled = false;
              pageRenderStatus.textContent = `Page "${selectedPage.name}" rendered. Next: "${allPages[nextPageIndex].name}"`;
            } else {
              renderNextPageBtn.style.display = 'none';
              pageRenderStatus.textContent = `Page "${selectedPage.name}" rendered. (last page)`;
            }
          }
        }

        renderNextPageBtn.addEventListener('click', async () => {
          if (!isIncrementalMode) return;

          if (nextPageIndex >= allPages.length) {
            renderNextPageBtn.disabled = true;
            pageRenderStatus.textContent = 'No more pages.';
            return;
          }

          renderNextPageBtn.disabled = true;
          const page = allPages[nextPageIndex];
          const parent = document.getElementById('container');
          const wcs = buildPageVizCards(page, parent);

          pageRenderStatus.textContent = `Adding page: ${page.name}...`;
          try {
             await dossier.addWidgets(wcs);
          } catch (e) {
            console.error(e);
            pageRenderStatus.textContent = `Failed to add page "${page.name}".`;
            renderNextPageBtn.disabled = false;
            return;
          }
          nextPageIndex++;

          if (nextPageIndex < allPages.length) {
            renderNextPageBtn.disabled = false;
            pageRenderStatus.textContent = `Page "${page.name}" added. Next: "${allPages[nextPageIndex].name}"`;
          } else {
            pageRenderStatus.textContent = `All pages rendered.`;
          }
        });

        function configurePageSelecter() {
          for (const chapter of dossierDefinition.chapters) {
            for (const page of chapter.pages) {
              const optionElement = document.createElement('option');
              optionElement.value = page.name;
              optionElement.text = page.name;
              pageSelecter.add(optionElement);
            }
            pageSelecter.selectedIndex = 0;
          }
        }
      };
    </script>
  </body>
</html>
