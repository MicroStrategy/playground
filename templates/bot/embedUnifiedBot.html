<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <script
      type="text/javascript"
      src="https://demo.microstrategy.com/MicroStrategyLibrary/javascript/native-embedding-sdk.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@12/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.2/dist/purify.min.js"></script>
    <style>
      /* Style for the chat container */
      .parent-div {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .title-bar {
        width: 100%;
        height: 100%;
        box-shadow: 0 4px 4px -3px rgba(0, 0, 0, 0.2);
      }
      .content {
        width: 100%;
        flex-grow: 1; /* Fill remaining space */
        align-items: stretch;
        display: flex;
        flex-direction: row;
      }
      .client-web {
        flex: 0 0 auto;
        width: 75%;
      }
      .client-web img {
        position: relative;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
      }
      .chatbox {
        flex: 0 0 auto;
        width: 25%;
        display: flex;
        flex-direction: column;
      }
      .chat-title {
        font-size: 16px;
        text-align: center;
        margin-left: 10px;
        margin-top: 10px;
        margin-bottom: 10px;
        font-family: sans-serif;
      }
      .chat-container {
        width: 100%;
        height: 83%;
        overflow-y: scroll;
        margin-bottom: 10px;
      }
      .ask-message {
        max-width: 80%;
        display: block; /* Display on separate lines */
        margin-left: auto;
        word-wrap: break-word; /* Allow content to wrap */
        border: 0px solid;
        padding: 10px;
        margin-bottom: 15px; /* Add margin between messages */
        width: fit-content; /* Set width to fit content */
        background-color: #0e6ff917;
        border-radius: 10px;
        margin-right: 10px;
      }
      .answer-message {
        word-wrap: break-word;
        display: inline-block;
        border: 2px solid #575a5d1a;
        padding: 10px;
        margin-bottom: 15px; /* Add margin between messages */
        background-color: white;
        border-radius: 10px;
        margin-left: 10px;
        margin-right: 20px;
      }
      .answer-viz {
        margin-top: 5px;
        width: 100%;
        height: 250px;
      }
      .input-wapper {
        flex-grow: 1;
        display: flex;
        flex-direction: row;
        border-radius: 10px;
        margin-left: 10px;
        margin-right: 10px;
        margin-bottom: 5px;
        box-shadow: 0px 0px 3px 0px;
      }
      .input-text-wapper {
        width: 85%;
        margin-top: 6px;
      }
      .user-input {
        flex: 1;
        padding: 5px;
        margin-left: 2px;
        margin-bottom: 5px;
        width: 100%;
        border: none;
      }
      .send-button {
        background-color: white;
        border: none;
        margin-top: auto;
        margin-bottom: 5px;
        margin-right: 2px;
      }
      .send-pic {
        width: 18px;
        height: 18px;
      }
      .bot-icon {
        width: 30px;
        height: 30px;
        margin-left: 5px;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="parent-div">
      <img class="title-bar" src="./templates/images/navbar.png" alt="Example Image" />
      <div class="content">
        <div class="client-web" id="clientWeb">
          <img src="./templates/images/client_web.png" alt="Example Image" />
        </div>
        <div class="chatbox" id="chatBox">
          <div class="chat-title">Find My Hotel</div>
          <div class="chat-container" id="chat-container"></div>
          <div class="input-wapper">
            <img class="bot-icon" src="./templates/images/botIcon.png" alt="Example Image" />
            <div class="input-text-wapper">
              <input
                type="text"
                class="user-input"
                id="userInput"
                placeholder="Ask me a question..."
                disabled
              />
            </div>
            <button class="send-button" onclick="sendMessage()">
              <img class="send-pic" src="./templates/images/Send.png" alt="Send button" />
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript">
      function setChatBoxHeight() {
        var leftDiv = document.getElementById('clientWeb');
        var rightDiv = document.getElementById('chatBox');

        // Set the height of left div equal to the height of right div
        rightDiv.style.height = leftDiv.offsetHeight + 'px';
      }
      // Call setLeftDivHeight on window load and resize events
      window.addEventListener('load', setChatBoxHeight);
      window.addEventListener('resize', setChatBoxHeight);

      // Pressing Enter key also sends message
      document.getElementById('userInput').addEventListener('keyup', function (event) {
        if (event.keyCode === 13) {
          // Enter key
          event.preventDefault();
          sendMessage();
        }
      });

      const sendMessage = async () => {
        var userInput = document.getElementById('userInput');
        var message = userInput.value;
        // clear the input box and disable it until we get responds
        userInput.value = '';
        userInput.disabled = true;

        if (message.trim() !== '') {
          // render the question message
          addQuestionMsg(message);
          console.log('Searching for bot to answer this question...');
          addAnswerMsg(null, null, false, true);
          const answerId = await askQuestion(message);
          // can not find an appropriate bot to answer the question
          if (!answerId) {
            // render the answer messgae that no bot is found
            addAnswerMsg(null, null, true);
            document.getElementById('userInput').disabled = false;
            return;
          }
          // retrieve the answer content and render it
          getAnswer(answerId);
        }
      };

      var libraryUrl = 'https://demo.microstrategy.com/MicroStrategyLibrary';
      var bot = null;
      var environment = null;
      var authToken = null;
      var containerId = 0;
      const md = window.markdownit();

      // render a question message
      function addQuestionMsg(msg) {
        var chatContainer = document.getElementById('chat-container');
        var messageElement = document.createElement('div');
        messageElement.classList.add('ask-message');
        // *** NEED TO SANITIZE THE INPUT TO PREVENT XSS ATTACKS! ***
        messageElement.textContent = DOMPurify.sanitize(msg);
        chatContainer.appendChild(messageElement);
        chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to bottom
      }

      // render an answer message
      async function addAnswerMsg(
        question,
        bot = null,
        error = false,
        searchForBot = false,
        botConfig = null,
      ) {
        var chatContainer = document.getElementById('chat-container');
        if (searchForBot) {
          let searchForBotElement = document.createElement('div');
          searchForBotElement.classList.add('answer-message');
          searchForBotElement.textContent = `Searching for a bot to answer your question...`;
          containerId += 1;
          searchForBotElement.id = containerId;
          chatContainer.appendChild(searchForBotElement);
          chatContainer.scrollTop = chatContainer.scrollHeight;
          return;
        }
        if (botConfig) {
          let targetBotElement = document.getElementById(containerId);
          targetBotElement.classList.add('answer-message');
          targetBotElement.textContent = `Bot '${botConfig.name}' is matched to answer your question.`;
          chatContainer.scrollTop = chatContainer.scrollHeight;
          return;
        }
        if (error) {
          let errorMessageElement = document.getElementById(containerId);
          errorMessageElement.classList.add('answer-message');
          errorMessageElement.textContent = `We couldn't find a bot to answer your question. This might be because there are no available bots in the scope you provided, or none of the bots you have access to can answer your question. Please check your parameters and access privileges.`;
          chatContainer.scrollTop = chatContainer.scrollHeight;
          return;
        }
        let botMessageElement = document.getElementById(question.id);
        // If the answer div doesn't exist, create a new one with a default message indicating the bot is thinking
        if (!botMessageElement) {
          botMessageElement = document.createElement('div');
          botMessageElement.id = question.id;
          botMessageElement.classList.add('answer-message');
          botMessageElement.textContent = 'The bot is thinking, please wait...';

          // Append the new div to the chat-box
          chatContainer.appendChild(botMessageElement);
          chatContainer.scrollTop = chatContainer.scrollHeight;
          return;
        }
        // generally, there is only one answer for a question
        for (const answer of question.answers) {
          botMessageElement.innerHTML = md.render(answer.text);
          // render visualization if the answer type is visualization
          if (answer.type === 'visualization') {
            var answerVizElement = document.createElement('div');
            answerVizElement.id = answer.data.id;
            answerVizElement.classList.add('answer-viz');
            botMessageElement.appendChild(answerVizElement);
            await bot.renderVisualization(answer.data.id, answerVizElement);
          }
          chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to bottom
        }
      }

      // ask a question and it will be routed to the appropriate bot
      async function askQuestion(msg) {
        // the contentGroupIds is optional
        // ?contentGroupIds=75A330687C4E2520BA5819BB9476A387
        const askQuestionUrl = `${libraryUrl}/api/questions`; // replace with your API endpoint
        const question = {
          text: msg, // replace with your question text
        };
        let response;
        response = await fetch(askQuestionUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json; charset=utf-8',
            'X-MSTR-AuthToken': authToken,
            Prefer: 'respond-async',
          },
          body: JSON.stringify(question),
          credentials: 'include', // Including cookie
          mode: 'cors', // Setting as cors mode for cross origin
        });
        const answer = await response.json();
        // return the answer id which contains the routed bot info
        return answer.id;
      }

      // get the answer content and render it
      async function getAnswer(answerId) {
        const retrieveAnswer = async (answerId) => {
          const getAnswerUrl = `${libraryUrl}/api/questions/${answerId}`;
          const answerRes = await fetch(getAnswerUrl, {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json; charset=utf-8',
              'X-MSTR-AuthToken': authToken,
              Prefer: 'respond-async',
            },
            credentials: 'include', // Including cookie
            mode: 'cors', // Setting as cors mode for cross origin
          });
          return await answerRes.json();
        };

        let botInfo = parseBotConfigs(answerId);
        // get the bot configuration from the bot id
        let botConfig = await getBotConfigInfo(botInfo);
        console.log(`routing to bot: ${JSON.stringify(botConfig.name)}`);
        // render the answer message of the routed bot info
        addAnswerMsg(null, null, false, false, { name: botConfig.name, id: botInfo.objectId });

        // retrieve the answer content from the answerId
        let answerData = await retrieveAnswer(answerId);
        addAnswerMsg(answerData);
        // load the bot
        let bot = await environment.loadBot(botInfo);
        // wait for the answer to be ready
        while (answerData && answerData.answers.length === 0) {
          console.log('answer is not ready yet, please wait...');
          answerData = await retrieveAnswer(answerId);
          // wait 1 sec
          await new Promise((resolve) => setTimeout(resolve, 1000));
        }
        addAnswerMsg(answerData, bot);
        // enable the input box
        document.getElementById('userInput').disabled = false;
      }

      function parseBotConfigs(answerData) {
        let info = answerData.split(':');
        return {
          projectId: info[0],
          objectId: info[1],
          questionId: info[2],
        };
      }

      // trigger ask question api
      async function getBotConfigInfo({ projectId, objectId }) {
        const askQuestionUrl = `${libraryUrl}/api/bots/${objectId}/configuration`;
        let response;
        response = await fetch(askQuestionUrl, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json; charset=utf-8',
            'X-MSTR-AuthToken': authToken,
            Prefer: 'respond-async',
            'X-MSTR-ProjectID': projectId,
          },
          credentials: 'include', // Including cookie
          mode: 'cors', // Setting as cors mode for cross origin
        });
        const botInfo = await response.json();
        return botInfo;
      }

      // login and load the environment
      const loadEnv = async () => {
        try {
          console.log('Loading environment...');
          // feature flag for enable chat between multiple bots
          window.microstrategy.nativeEmbedding.featureFlags.multipleDossiers = true;
          // Log in to get the auth token
          const getAuthToken = async () => {
            // here we use standard login by default, we can also use the other login in methods (SAML/OIDC ...).
            return fetch(`${libraryUrl}/api/auth/login`, {
              method: 'POST',
              credentials: 'include', // including cookie
              mode: 'cors', // setting as CORS mode for cross origin
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                loginMode: 1,
                username: 'usernamePlaceholder',
                password: 'passwordPlaceholder',
              }),
            })
              .then((response) => {
                if (response && response.ok) {
                  return response.headers.get('X-MSTR-authToken');
                }
                throw Error('Failed to fetch auth token.');
              })
              .catch((error) => {
                console.log('Error:', error);
              });
          };

          const config = {
            serverUrl: libraryUrl,
            getAuthToken,
          };
          // INSERT PROPERTIES BELOW HERE

          // INSERT PROPERTIES ABOVE HERE
          environment = await microstrategy.embeddingComponent.environments.create(config);
          // get the auth token used for REST API calls
          authToken = environment._getEnvironment().getAuthToken();
          // enable the input box
          document.getElementById('userInput').disabled = false;
          console.log('The environment is ready. You can start chatting now.');
        } catch (error) {
          console.error(
            'Please fill in the correct environment info in "Your Environment":',
            error,
          );
        }
      };
      loadEnv();
    </script>
  </body>
</html>
